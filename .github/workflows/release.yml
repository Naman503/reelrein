name: Release

# Push a tag like v0.2.0 (matching versionName in app/build.gradle.kts) to build a signed APK
# and publish it as a GitHub release. Release notes come from docs/releases/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed APK -> GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $VERSION"
            exit 1
          fi

      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Check signature and permissions
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          # The only address the app may talk to: the usage-report API (telemetry/Usage.kt).
          HOSTS=$(grep -rhoE "https?://[A-Za-z0-9.-]+" app/src/main | grep -v "schemas.android.com" | sort -u)
          if [ "$HOSTS" != "https://api.np-dev.duckdns.org" ]; then
            echo "::error::Unexpected network addresses in the app: $HOSTS"; exit 1
          fi
          echo "OK: the app only talks to $HOSTS"
          # Stable name, so https://github.com/Naman503/reelrein/releases/latest/download/ReelRein.apk
          # always gets the newest release.
          cp "$APK" ReelRein.apk
          sha256sum ReelRein.apk > ReelRein.apk.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          ARGS=(--title "ReelRein ${GITHUB_REF_NAME#v}")
          if [ -f "$NOTES" ]; then ARGS+=(--notes-file "$NOTES"); else ARGS+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" ReelRein.apk ReelRein.apk.sha256 "${ARGS[@]}"
