name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Android app (debug + release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        # No signing secrets here, so the release build uses the debug key (never published).
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: Only the usage-report API
        run: |
          # The only address the app may talk to: the usage-report API (telemetry/Usage.kt).
          HOSTS=$(grep -rhoE "https?://[A-Za-z0-9.-]+" app/src/main | grep -v "schemas.android.com" | sort -u)
          if [ "$HOSTS" != "https://api.np-dev.duckdns.org" ]; then
            echo "::error::Unexpected network addresses in the app: $HOSTS"; exit 1
          fi
          echo "OK: the app only talks to $HOSTS"
