name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Android app (debug + release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        # No signing secrets here, so the release build uses the debug key (never published).
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: No internet permission
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::The APK requests INTERNET. ReelRein must never have network access."
            exit 1
          fi
          echo "OK: no INTERNET permission in $APK"
